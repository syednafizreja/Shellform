[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellform"
version = "0.0.0"
description = "The carbon cost of seismic resilience: gravity-only versus seismic-aware form-finding of concrete shells."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Nafiz Reja Hasib" }]
keywords = ["form-finding", "concrete shells", "seismic design", "embodied carbon", "force density method"]
# Dependencies are pinned in environment.yml (conda env "shellform").
# ShellBench is installed in editable mode from a clone checked out at the
# tag in src/shellform/pin.py.
dependencies = []

[project.urls]
Repository = "https://github.com/syednafizreja/Shellform"
Issues = "https://github.com/syednafizreja/Shellform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
